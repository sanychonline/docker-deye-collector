version: "3.9"

services:
  deye:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: deye-collector
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:2
    container_name: deye-caddy
    env_file:
      - .env
    ports:
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTP_PORT:-18080}:80"
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTPS_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - deye
    restart: always

volumes:
  caddy_data:
  caddy_config:
