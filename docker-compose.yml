version: "3.9"

services:
  deye:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: deye-collector
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:2
    container_name: deye-caddy
    env_file:
      - .env
    ports:
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTP_PORT:-18080}:80"
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTPS_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - deye
    restart: always
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: trader-bot-cadvisor
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=udp,sched
    restart: unless-stopped
    ports:
      - "${DEYE_CADVISOR_PORT:-127.0.0.1:18090}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - default

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: trader-bot-otel-collector
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    environment:
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-https://otlp-gateway-prod-eu-west-2.grafana.net/otlp}
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
